name: omr_desktop
description: Teacher-facing desktop app — local server, class record, sheet generator.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Shared models / wire protocol
  omr_shared:
    path: ../shared

  # Local server
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.0

  # Database
  sqflite_common_ffi: ^2.3.3

  # PDF / printing / QR
  pdf: ^3.11.0
  printing: ^5.13.0
  qr_flutter: ^4.1.0
  barcode: ^2.2.4

  # Export
  excel: ^4.0.3

  # Utilities
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  network_info_plus: ^6.0.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
