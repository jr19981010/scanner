name: omr_mobile
description: Android scanner — camera, OMR, QR, submit-to-desktop.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1

  omr_shared:
    path: ../shared

  # Camera + scanning
  camera: ^0.11.0
  mobile_scanner: ^5.2.0           # QR (ML Kit under the hood)
  image: ^4.2.0                    # pure-Dart image processing
  permission_handler: ^11.3.0

  # Networking
  http: ^1.2.0
  web_socket_channel: ^3.0.0

  # Local cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  path_provider: ^2.1.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
